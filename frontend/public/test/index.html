<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supabase Upload Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --accent: #00ff88;
      --accent2: #ff3c6e;
      --warn: #ffaa00;
      --text: #e0e0f0;
      --muted: #555570;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header h1 {
      font-family: var(--display);
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-shadow: 0 0 30px rgba(0,255,136,0.3);
    }

    header p {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 10px 14px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,255,136,0.08);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div { flex: 1; }

    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .file-drop:hover, .file-drop.dragover {
      border-color: var(--accent);
      background: rgba(0,255,136,0.03);
    }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop .icon { font-size: 1.8rem; margin-bottom: 8px; }
    .file-drop p { font-size: 0.75rem; color: var(--muted); }
    .file-drop .fname { color: var(--accent); font-size: 0.75rem; margin-top: 6px; }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #000;
      box-shadow: 0 4px 20px rgba(0,255,136,0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 30px rgba(0,255,136,0.4);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Log terminal */
    .terminal {
      background: #07070d;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .terminal-bar {
      background: var(--surface);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #ffbd2e; }
    .dot.g { background: #28c840; }

    .terminal-title {
      font-size: 0.65rem;
      color: var(--muted);
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .terminal-body {
      padding: 14px;
      min-height: 160px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.72rem;
      line-height: 1.7;
    }

    .log-line { display: flex; gap: 8px; }
    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-msg { word-break: break-all; }
    .log-success .log-msg { color: var(--accent); }
    .log-error .log-msg { color: var(--accent2); }
    .log-warn .log-msg { color: var(--warn); }
    .log-info .log-msg { color: var(--text); }

    /* Result box */
    .result-box {
      margin-top: 14px;
      display: none;
    }

    .result-box.show { display: block; }

    .result-url {
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.72rem;
      color: var(--accent);
      word-break: break-all;
      cursor: pointer;
      position: relative;
    }

    .result-url::after {
      content: '📋 Tap to copy';
      display: block;
      color: var(--muted);
      font-size: 0.65rem;
      margin-top: 4px;
    }

    .copied::after { content: '✅ Copied!' !important; color: var(--accent) !important; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-ok { background: rgba(0,255,136,0.12); color: var(--accent); }
    .badge-err { background: rgba(255,60,110,0.12); color: var(--accent2); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .check-section { margin-top: 14px; }
    .check-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .check-item:last-child { border-bottom: none; }
    .check-label { color: var(--muted); }
    .check-val { font-weight: 700; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(0,255,136,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>⚡ Supabase Tester</h1>
    <p>API connection + bucket upload check</p>
  </header>

  <!-- Config Card -->
  <div class="card">
    <div class="card-title">🔑 Supabase Config</div>

    <label>Supabase URL</label>
    <input type="text" id="supa-url" placeholder="https://xxxx.supabase.co" />

    <label>Service Role Key (ya Anon Key)</label>
    <input type="password" id="supa-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />

    <div class="row">
      <div>
        <label>Bucket Name</label>
        <input type="text" id="bucket" placeholder="yt-clipper" value="yt-clipper" />
      </div>
    </div>
  </div>

  <!-- File Card -->
  <div class="card">
    <div class="card-title">📁 Test File</div>
    <div class="file-drop" id="drop-zone">
      <input type="file" id="file-input" accept="*/*" />
      <div class="icon">🎬</div>
      <p>Koi bhi file drag karo ya tap karo</p>
      <p class="fname" id="file-name">Koi file select nahi</p>
    </div>
  </div>

  <!-- Actions -->
  <div class="card">
    <div class="card-title">🧪 Tests</div>

    <button class="btn btn-primary" id="btn-connect" onclick="testConnection()">
      1. Connection Test karo
    </button>

    <hr class="divider" />

    <button class="btn btn-primary" id="btn-upload" onclick="testUpload()" disabled>
      2. File Upload Test karo
    </button>

    <div class="result-box" id="result-box">
      <div class="result-url" id="result-url" onclick="copyUrl()"></div>
    </div>
  </div>

  <!-- Terminal -->
  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot r"></div>
      <div class="dot y"></div>
      <div class="dot g"></div>
      <span class="terminal-title">Live Logs</span>
    </div>
    <div class="terminal-body" id="log-body">
      <div class="log-line log-info">
        <span class="log-time">--:--:--</span>
        <span class="log-msg">Ready. Config bharo aur test shuru karo...</span>
      </div>
    </div>
  </div>

</div>

<script>
  // --- Supabase JS CDN ---
  const SUPABASE_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  let supabase = null;
  let uploadFile = null;

  // Load Supabase SDK
  const script = document.createElement('script');
  script.src = SUPABASE_CDN;
  script.onload = () => log('info', '✅ Supabase SDK load ho gaya');
  script.onerror = () => log('error', '❌ Supabase SDK load nahi hua — internet check karo');
  document.head.appendChild(script);

  // File input
  document.getElementById('file-input').addEventListener('change', e => {
    uploadFile = e.target.files[0];
    document.getElementById('file-name').textContent = uploadFile
      ? `${uploadFile.name} (${(uploadFile.size/1024).toFixed(1)} KB)`
      : 'Koi file select nahi';
  });

  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    uploadFile = e.dataTransfer.files[0];
    if (uploadFile) document.getElementById('file-name').textContent = `${uploadFile.name} (${(uploadFile.size/1024).toFixed(1)} KB)`;
  });

  function getConfig() {
    return {
      url: document.getElementById('supa-url').value.trim(),
      key: document.getElementById('supa-key').value.trim(),
      bucket: document.getElementById('bucket').value.trim() || 'yt-clipper',
    };
  }

  function now() {
    return new Date().toLocaleTimeString('en-IN', { hour12: false });
  }

  function log(type, msg) {
    const body = document.getElementById('log-body');
    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    line.innerHTML = `<span class="log-time">${now()}</span><span class="log-msg">${msg}</span>`;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
  }

  async function testConnection() {
    const { url, key, bucket } = getConfig();

    if (!url || !key) {
      log('error', '❌ URL aur Key dono bharo pehle!');
      return;
    }

    if (!window.supabase) {
      log('error', '❌ Supabase SDK abhi load nahi hua, thoda wait karo');
      return;
    }

    const btn = document.getElementById('btn-connect');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Testing...';

    log('info', `🔗 Connecting: ${url}`);
    log('info', `🪣 Bucket: ${bucket}`);

    try {
      supabase = window.supabase.createClient(url, key);
      log('info', '✅ Client create ho gaya');

      // Test: list bucket files
      log('info', `📂 Bucket "${bucket}" access check ho raha hai...`);
      const { data, error } = await supabase.storage.from(bucket).list('', { limit: 5 });

      if (error) {
        log('error', `❌ Bucket error: ${error.message}`);
        log('warn', `⚠️ Check: bucket exist karta hai? RLS/public policy set hai?`);
        btn.innerHTML = '1. Connection Test karo';
        btn.disabled = false;
        return;
      }

      log('success', `✅ Bucket connected! Files found: ${data.length}`);
      if (data.length > 0) {
        data.slice(0, 3).forEach(f => log('info', `   📄 ${f.name}`));
      }

      document.getElementById('btn-upload').disabled = false;
      log('success', '🎉 Connection OK! Ab upload test kar sakte ho');

    } catch (e) {
      log('error', `❌ Exception: ${e.message}`);
    }

    btn.innerHTML = '1. Connection Test karo';
    btn.disabled = false;
  }

  async function testUpload() {
    if (!supabase) {
      log('error', '❌ Pehle connection test karo');
      return;
    }

    const { bucket } = getConfig();

    // Auto-create a small test file if nothing selected
    if (!uploadFile) {
      log('warn', '⚠️ Koi file nahi select ki — dummy .txt file upload karunga');
      const content = `Supabase test file\nTime: ${new Date().toISOString()}\nBucket: ${bucket}`;
      uploadFile = new File([content], 'test.txt', { type: 'text/plain' });
    }

    const btn = document.getElementById('btn-upload');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Uploading...';

    const testPath = `test/test_${Date.now()}_${uploadFile.name}`;
    log('info', `⬆️ Uploading: ${testPath}`);
    log('info', `📦 Size: ${(uploadFile.size/1024).toFixed(1)} KB`);

    try {
      const { data, error } = await supabase.storage
        .from(bucket)
        .upload(testPath, uploadFile, {
          contentType: uploadFile.type || 'application/octet-stream',
          upsert: true
        });

      if (error) {
        log('error', `❌ Upload fail: ${error.message}`);

        if (error.message.includes('security')) {
          log('warn', '💡 Fix: Supabase → Storage → Policies → INSERT policy add karo');
        } else if (error.message.includes('not found') || error.message.includes('404')) {
          log('warn', `💡 Fix: Bucket "${bucket}" exist nahi karta — Supabase me banao`);
        } else if (error.message.includes('401') || error.message.includes('403')) {
          log('warn', '💡 Fix: Service Role Key use karo, Anon key me permissions nahi');
        }

        btn.innerHTML = '2. File Upload Test karo';
        btn.disabled = false;
        return;
      }

      log('success', `✅ Upload success! Path: ${data.path}`);

      // Get public URL
      const { data: urlData } = supabase.storage.from(bucket).getPublicUrl(testPath);
      const publicUrl = urlData?.publicUrl;

      if (publicUrl) {
        log('success', `🔗 Public URL mila!`);
        const box = document.getElementById('result-box');
        const urlEl = document.getElementById('result-url');
        urlEl.textContent = publicUrl;
        box.classList.add('show');
      } else {
        log('warn', '⚠️ Upload hua par public URL nahi mila — bucket public set karo');
      }

      // Cleanup
      log('info', '🧹 Test file delete ho rahi hai...');
      await supabase.storage.from(bucket).remove([testPath]);
      log('info', '✅ Test file cleanup done');
      log('success', '🎉 Sab kuch theek hai! Production ready hai.');

    } catch (e) {
      log('error', `❌ Exception: ${e.message}`);
    }

    btn.innerHTML = '2. File Upload Test karo';
    btn.disabled = false;
  }

  function copyUrl() {
    const urlEl = document.getElementById('result-url');
    navigator.clipboard.writeText(urlEl.textContent.replace(/📋.*/, '').trim()).then(() => {
      urlEl.classList.add('copied');
      setTimeout(() => urlEl.classList.remove('copied'), 2000);
    });
  }
</script>
</body>
</html>
